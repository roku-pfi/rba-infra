# Tenant app (namespace demo). Platform stays in the `rba` release.

image: rba-demo-banking
tag: dev
pullPolicy: Never
port: 8002
replicas: 1

idpPublicUrl: http://localhost:8080
idpInternalHost: idp.rba.svc.cluster.local
idpInternalPort: 8001
publicUrl: http://demo.localhost:8080
# Public client id at the IdP (rba_idp.client_ids.SEEDED), used in login URLs.
clientId: rk_Bk7mQ2xVn9PwR4tL
# Extra environment (cloud: DEPLOYMENT=cloud).
env: {}

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

ingress:
  enabled: true
  className: traefik
  host: demo.localhost
  annotations: {}
  originVerify: ""

waitImage: busybox:1.36
