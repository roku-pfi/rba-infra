{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-banking
  labels:
    app.kubernetes.io/name: demo-banking
    app.kubernetes.io/part-of: rba-demo
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-banking
                port:
                  number: {{ .Values.port }}
{{- end }}
