{{- if .Values.dataPlane.rabbitmq.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  labels:
    {{- include "rba.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.dataPlane.rabbitmq.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: rabbitmq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "rba.selector" (dict "root" . "name" "rabbitmq") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rba.selector" (dict "root" . "name" "rabbitmq") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 999
        # Re-applying the group on every mount made the Erlang cookie
        # group-readable, and RabbitMQ refuses to start then (seen after a k3d
        # stop/start). Only fix ownership when the volume root is wrong.
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Repairs a cookie a previous mount already widened.
        - name: cookie-permissions
          image: {{ .Values.dataPlane.rabbitmq.image }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "c=/var/lib/rabbitmq/.erlang.cookie; [ ! -f $c ] || { chown 999:999 $c && chmod 600 $c; }"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      containers:
        - name: rabbitmq
          image: {{ .Values.dataPlane.rabbitmq.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "rba.secretName" $ }}
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "rba.secretName" $ }}
                  key: RABBITMQ_DEFAULT_PASS
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          resources:
            {{- toYaml .Values.dataPlane.rabbitmq.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 20
            timeoutSeconds: 5
            initialDelaySeconds: 30
      volumes:
        - name: data
          {{- if .Values.dataPlane.rabbitmq.persistence.enabled }}
          persistentVolumeClaim:
            claimName: rabbitmq-data
          {{- else }}
          # The cloud environment is rebuilt every session (ADR-0031).
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: rabbitmq
spec:
  selector:
    {{- include "rba.selector" (dict "root" . "name" "rabbitmq") | nindent 4 }}
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
