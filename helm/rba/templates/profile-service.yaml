apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-service
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: profile-service
spec:
  replicas: {{ .Values.apps.profileService.replicas }}
  selector:
    matchLabels:
      {{- include "rba.selector" (dict "root" . "name" "profile-service") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rba.selector" (dict "root" . "name" "profile-service") | nindent 8 }}
    spec:
      initContainers:
        {{- include "rba.wait" (dict "name" "postgres" "host" "postgres" "port" 5432 "image" .Values.images.wait) | nindent 8 }}
        {{- include "rba.wait" (dict "name" "redis" "host" "redis" "port" 6379 "image" .Values.images.wait) | nindent 8 }}
        {{- include "rba.wait" (dict "name" "rabbitmq" "host" "rabbitmq" "port" 5672 "image" .Values.images.wait) | nindent 8 }}
      containers:
        - name: profile-service
          image: "{{ .Values.apps.profileService.image }}:{{ .Values.images.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: INIT_ON_STARTUP
              value: "{{ include "rba.initOnStartup" $ }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "rba.secretName" $ }}
                  key: PROFILE_DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "rba.secretName" $ }}
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "rba.secretName" $ }}
                  key: RABBITMQ_URL
          resources:
            {{- toYaml .Values.apps.profileService.resources | nindent 12 }}
