{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rba.secretName" . }}
  labels:
    {{- include "rba.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.credentials.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.credentials.password | quote }}
  RABBITMQ_DEFAULT_USER: {{ .Values.credentials.username | quote }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.credentials.password | quote }}
  REDIS_URL: "redis://redis:6379/0"
  RABBITMQ_URL: "amqp://{{ .Values.credentials.username }}:{{ .Values.credentials.password }}@rabbitmq:5672/"
  DECISION_DATABASE_URL: "postgresql+psycopg://{{ .Values.credentials.username }}:{{ .Values.credentials.password }}@postgres:5432/rba_decision"
  PROFILE_DATABASE_URL: "postgresql+psycopg://{{ .Values.credentials.username }}:{{ .Values.credentials.password }}@postgres:5432/rba_profile"
  AUDIT_DATABASE_URL: "postgresql+psycopg://{{ .Values.credentials.username }}:{{ .Values.credentials.password }}@postgres:5432/rba_audit"
  IDP_DATABASE_URL: "postgresql+psycopg://{{ .Values.credentials.username }}:{{ .Values.credentials.password }}@postgres:5432/rba_idp"
{{- end }}
