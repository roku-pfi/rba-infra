{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: kube-state-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-state-metrics
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: kube-state-metrics
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "resourcequotas", "replicationcontrollers"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-state-metrics
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rba.selector" (dict "root" . "name" "kube-state-metrics") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rba.selector" (dict "root" . "name" "kube-state-metrics") | nindent 8 }}
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: {{ .Values.observability.kubeStateMetrics.image | quote }}
          args:
            - --port=8080
            - --namespaces={{ .Release.Namespace }}
            - --metric-allowlist=kube_deployment_spec_replicas,kube_deployment_status_replicas,kube_deployment_status_replicas_available,kube_horizontalpodautoscaler_spec_max_replicas,kube_horizontalpodautoscaler_spec_min_replicas,kube_horizontalpodautoscaler_spec_target_metric,kube_horizontalpodautoscaler_status_current_replicas,kube_horizontalpodautoscaler_status_desired_replicas,kube_horizontalpodautoscaler_status_target_metric,kube_pod_status_phase,kube_pod_container_resource_requests,kube_pod_container_resource_limits
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.observability.kubeStateMetrics.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: kube-state-metrics
spec:
  selector:
    {{- include "rba.selector" (dict "root" . "name" "kube-state-metrics") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
