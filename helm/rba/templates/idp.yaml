apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: idp
spec:
  replicas: {{ .Values.apps.idp.replicas }}
  selector:
    matchLabels:
      {{- include "rba.selector" (dict "root" . "name" "idp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rba.selector" (dict "root" . "name" "idp") | nindent 8 }}
    spec:
      initContainers:
        {{- include "rba.wait" (dict "name" "postgres" "host" .Values.dataPlane.postgres.host "port" 5432 "image" .Values.images.wait) | nindent 8 }}
        {{- include "rba.wait" (dict "name" "pdp" "host" "decision-service" "port" .Values.apps.decisionService.port "image" .Values.images.wait) | nindent 8 }}
      containers:
        - name: idp
          image: {{ include "rba.image" (dict "root" . "name" .Values.apps.idp.image) | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.apps.idp.port }}
            # Prometheus only, never in the Ingress (RF-20).
            - name: metrics
              containerPort: 9100
          env:
            {{- include "rba.idpEnv" . | nindent 12 }}
            - name: METRICS_PORT
              value: "9100"
          resources:
            {{- toYaml .Values.apps.idp.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 18
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: idp
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: idp
spec:
  selector:
    {{- include "rba.selector" (dict "root" . "name" "idp") | nindent 4 }}
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
    - name: http
      port: {{ .Values.apps.idp.port }}
      targetPort: http
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: idp
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: idp
  {{- with include "rba.ingressAnnotations" (dict "root" . "service" "idp" "health" "/healthz") | trim }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: idp
                port:
                  number: {{ .Values.apps.idp.port }}
{{- end }}
