apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: idp
spec:
  replicas: {{ .Values.apps.idp.replicas }}
  selector:
    matchLabels:
      {{- include "rba.selector" (dict "root" . "name" "idp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rba.selector" (dict "root" . "name" "idp") | nindent 8 }}
    spec:
      initContainers:
        {{- include "rba.wait" (dict "name" "postgres" "host" "postgres" "port" 5432 "image" .Values.images.wait) | nindent 8 }}
        {{- include "rba.wait" (dict "name" "pdp" "host" "decision-service" "port" .Values.apps.decisionService.port "image" .Values.images.wait) | nindent 8 }}
      containers:
        - name: idp
          image: "{{ .Values.apps.idp.image }}:{{ .Values.images.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.apps.idp.port }}
          env:
            - name: INIT_ON_STARTUP
              value: "{{ include "rba.initOnStartup" $ }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "rba.secretName" $ }}
                  key: IDP_DATABASE_URL
            - name: PDP_BASE_URL
              value: "http://decision-service:{{ .Values.apps.decisionService.port }}"
            - name: AUDIT_BASE_URL
              value: "http://decision-service:{{ .Values.apps.decisionService.port }}"
            - name: SEED_BANK_REDIRECT_URI
              value: {{ .Values.apps.idp.seedRedirectUri | quote }}
            - name: WEBAUTHN_RP_ID
              value: {{ .Values.apps.idp.webauthnRpId | quote }}
            - name: WEBAUTHN_ORIGIN
              value: {{ .Values.apps.idp.webauthnOrigin | quote }}
          resources:
            {{- toYaml .Values.apps.idp.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 18
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: idp
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: idp
spec:
  selector:
    {{- include "rba.selector" (dict "root" . "name" "idp") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.apps.idp.port }}
      targetPort: http
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: idp
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: idp
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: idp
                port:
                  number: {{ .Values.apps.idp.port }}
{{- end }}
