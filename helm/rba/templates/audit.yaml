apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: audit-service
spec:
  replicas: {{ .Values.apps.auditService.replicas }}
  selector:
    matchLabels:
      {{- include "rba.selector" (dict "root" . "name" "audit-service") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rba.selector" (dict "root" . "name" "audit-service") | nindent 8 }}
    spec:
      initContainers:
        {{- include "rba.wait" (dict "name" "postgres" "host" "postgres" "port" 5432 "image" .Values.images.wait) | nindent 8 }}
        {{- include "rba.wait" (dict "name" "rabbitmq" "host" "rabbitmq" "port" 5672 "image" .Values.images.wait) | nindent 8 }}
      containers:
        - name: audit-service
          image: "{{ .Values.apps.auditService.image }}:{{ .Values.images.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rba-credentials
                  key: AUDIT_DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rba-credentials
                  key: RABBITMQ_URL
          resources:
            {{- toYaml .Values.apps.auditService.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-api
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: audit-api
spec:
  replicas: {{ .Values.apps.auditApi.replicas }}
  selector:
    matchLabels:
      {{- include "rba.selector" (dict "root" . "name" "audit-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rba.selector" (dict "root" . "name" "audit-api") | nindent 8 }}
    spec:
      initContainers:
        {{- include "rba.wait" (dict "name" "postgres" "host" "postgres" "port" 5432 "image" .Values.images.wait) | nindent 8 }}
      containers:
        - name: audit-api
          image: "{{ .Values.apps.auditApi.image }}:{{ .Values.images.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["rba-audit-api"]
          ports:
            - name: http
              containerPort: {{ .Values.apps.auditApi.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rba-credentials
                  key: AUDIT_DATABASE_URL
          resources:
            {{- toYaml .Values.apps.auditApi.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 18
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: audit-api
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: audit-api
spec:
  selector:
    {{- include "rba.selector" (dict "root" . "name" "audit-api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.apps.auditApi.port }}
      targetPort: http
