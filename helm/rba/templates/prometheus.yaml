{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: decision-service
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [{{ .Release.Namespace }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: decision-service
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: idp
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [{{ .Release.Namespace }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: idp
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics:8080"]
  # Alarms on risk and on the platform (RF-16). They show as firing in Grafana
  # and in Prometheus; the console reads them per tenant. Thresholds are for a
  # demo-sized deployment.
  alerts.yml: |
    groups:
      - name: risk
        rules:
          - alert: CredentialStuffing
            expr: sum by (tenant) (increase(rba_failed_logins_total[5m])) > 20
            labels: { severity: warning }
            annotations:
              summary: "Más de 20 contraseñas incorrectas en 5 min"
          - alert: SourceBlocked
            expr: sum by (tenant) (increase(rba_rule_hits_total{code="source_blocked"}[10m])) > 0
            labels: { severity: warning }
            annotations:
              summary: "Una IP quedó bloqueada por intentos fallidos"
          - alert: AccountUnderAttack
            expr: sum by (tenant) (increase(rba_rule_hits_total{code="failed_login_burst"}[10m])) > 0
            labels: { severity: info }
            annotations:
              summary: "Contraseñas incorrectas contra una cuenta desde lugares que no usa"
          - alert: HighBlockRate
            expr: |
              sum by (tenant) (rate(rba_decisions_total{enforced_action="BLOCK"}[10m]))
                / sum by (tenant) (rate(rba_decisions_total[10m])) > 0.2
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "Más del 20% de los inicios bloqueados"
      - name: platform
        rules:
          - alert: EngineFallback
            expr: sum by (tenant) (increase(rba_decisions_total{fallback="true"}[5m])) > 0
            labels: { severity: critical }
            annotations:
              summary: "El motor decidió sin modelo o sin perfil (respaldo)"
          - alert: EngineUnavailable
            expr: sum(increase(rba_idp_pdp_unavailable_total[5m])) > 0
            labels: { severity: critical }
            annotations:
              summary: "El IdP no pudo consultar al motor: pide passkey a todos"
          - alert: DecisionLatencyHigh
            expr: |
              histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{handler="/risk/evaluate"}[5m]))) > 0.2
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "p95 de decisión por encima de 200 ms (RNF-07)"
          - alert: EventRelayDown
            expr: kube_deployment_status_replicas_available{deployment="event-publisher"} == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "El relay de eventos está caído: los perfiles no aprenden"
---
{{- if .Values.observability.prometheus.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.observability.prometheus.persistence.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "rba.selector" (dict "root" . "name" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rba.selector" (dict "root" . "name" "prometheus") | nindent 8 }}
      annotations:
        rba.infra/chart: {{ .Chart.Version | quote }}
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: {{ .Values.observability.prometheus.image | quote }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.observability.prometheus.retention }}
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          resources:
            {{- toYaml .Values.observability.prometheus.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: prometheus
        - name: data
          {{- if .Values.observability.prometheus.persistence.enabled }}
          persistentVolumeClaim:
            claimName: prometheus
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    {{- include "rba.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
spec:
  selector:
    {{- include "rba.selector" (dict "root" . "name" "prometheus") | nindent 4 }}
  ports:
    - name: http
      port: 9090
      targetPort: http
{{- end }}
