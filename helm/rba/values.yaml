# Local-dev defaults. Credentials match compose (rba/rba) — not for production.
# App images are loaded into k3d via `scripts/k3d-up.sh` (imagePullPolicy: Never).

nameOverride: ""
fullnameOverride: rba

credentials:
  username: rba
  password: rba
  # Name of a Secret created outside the chart (OpenTofu, in the cloud). When
  # set, the chart creates none and every reference points at it.
  existingSecret: ""

# C-4. "startup": each service creates its schema and seed when it starts
# (k3d — Postgres is part of this chart, so nothing can run before it).
# "job": pre-install/pre-upgrade Jobs do it once, then replicas start without
# racing (cloud — RDS and the Secret exist before Helm runs).
init:
  mode: startup

images:
  # Empty: bare names, as k3d imports them. Cloud: the ECR registry.
  registry: ""
  tag: dev
  pullPolicy: Never
  wait: busybox:1.36

dataPlane:
  # In-chart Postgres and Redis are for k3d. The cloud disables both and points
  # `host` at RDS / ElastiCache (the wait-for init containers use it).
  redis:
    enabled: true
    host: redis
    image: redis:7-alpine
    persistence:
      size: 1Gi
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
  postgres:
    enabled: true
    host: postgres
    image: postgres:16-alpine
    persistence:
      size: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    persistence:
      # Off in the cloud: emptyDir, no EBS driver needed (ADR-0031 accepts
      # losing queued events with the pod; the outbox keeps the record).
      enabled: true
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        cpu: 500m
        memory: 512Mi

apps:
  decisionService:
    image: rba-decision-service
    replicas: 2
    port: 8000
    profileWriteMode: none
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
      # Fast scale-up so a 2–3 min load test can move replicas on a laptop.
      scaleUpStabilizationWindowSeconds: 0
  idp:
    image: rba-idp
    replicas: 1
    port: 8001
    seedRedirectUri: http://demo.localhost:8080/callback
    webauthnRpId: localhost
    webauthnOrigin: http://localhost:8080
    # Extra environment (cloud: DEPLOYMENT=cloud and its settings), and
    # variables read from keys of the credentials Secret.
    env:
      # Kaze Labs' portal (U-5), served at kaze.localhost by the `kaze` release.
      SEED_KAZE_REDIRECT_URI: http://kaze.localhost:8080/callback
    secretEnv: {}
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  eventPublisher:
    image: rba-event-publisher
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
  profileService:
    image: rba-profile-service
    # Users whose demo home history the init Job seeds (comma-separated).
    seedProfiles: usr_rb_martin,usr_kz_martin
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
  auditService:
    image: rba-audit-service
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
  auditApi:
    image: rba-audit-service
    replicas: 1
    port: 8002
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi

ingress:
  enabled: true
  className: traefik
  host: localhost
  # k3d maps host 8080 → loadbalancer 80 (see k3d/cluster.yaml).
  # Browser-facing origin; default http://<host>:8080 (k3d).
  publicUrl: ""
  # Extra Ingress annotations (cloud: the ALB's).
  annotations: {}
  # Cloud: the secret header CloudFront adds; every ALB rule requires it.
  originVerify: ""

# K8s-2: in-chart Prometheus + Grafana (not kube-prometheus-stack).
# Compose mode has no scrape stack — observability is cluster-only.
observability:
  enabled: true
  prometheus:
    image: prom/prometheus:v2.55.1
    retention: 6h
    persistence:
      enabled: true
      size: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  grafana:
    image: grafana/grafana:11.4.0
    adminUser: admin
    adminPassword: admin
    # Cloud: read the password from this key of the credentials Secret.
    adminPasswordKey: ""
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  kubeStateMetrics:
    image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.14.0
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
