# Local-dev defaults. Credentials match compose (rba/rba) — not for production.
# App images are loaded into k3d via `scripts/k3d-up.sh` (imagePullPolicy: Never).

nameOverride: ""
fullnameOverride: rba

credentials:
  username: rba
  password: rba

images:
  tag: dev
  pullPolicy: Never
  wait: busybox:1.36

dataPlane:
  redis:
    image: redis:7-alpine
    persistence:
      size: 1Gi
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
  postgres:
    image: postgres:16-alpine
    persistence:
      size: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    persistence:
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        cpu: 500m
        memory: 512Mi

apps:
  decisionService:
    image: rba-decision-service
    replicas: 2
    port: 8000
    profileWriteMode: none
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
      # Fast scale-up so a 2–3 min load test can move replicas on a laptop.
      scaleUpStabilizationWindowSeconds: 0
  idp:
    image: rba-idp
    replicas: 1
    port: 8001
    seedRedirectUri: http://demo.localhost:8080/callback
    webauthnRpId: localhost
    webauthnOrigin: http://localhost:8080
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  eventPublisher:
    image: rba-event-publisher
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
  profileService:
    image: rba-profile-service
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
  auditService:
    image: rba-audit-service
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
  auditApi:
    image: rba-audit-service
    replicas: 1
    port: 8002
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi

ingress:
  enabled: true
  className: traefik
  host: localhost
  # k3d maps host 8080 → loadbalancer 80 (see k3d/cluster.yaml).

# K8s-2: in-chart Prometheus + Grafana (not kube-prometheus-stack).
# Compose mode has no scrape stack — observability is cluster-only.
observability:
  enabled: true
  prometheus:
    image: prom/prometheus:v2.55.1
    retention: 6h
    persistence:
      size: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  grafana:
    image: grafana/grafana:11.4.0
    adminUser: admin
    adminPassword: admin
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  kubeStateMetrics:
    image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.14.0
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
