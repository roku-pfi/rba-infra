# Shared local data plane for the RBA polyrepo.
#
# Usage (from this repo):
#   docker compose up -d
#
# Services connect via localhost URLs — they do NOT own Redis/Postgres/RabbitMQ.
# See README.md / ADR notes in ../docs.
#
# Database-per-service: one Postgres *server*, multiple databases
# (see compose/init-databases.sql).

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - rba_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rba
      POSTGRES_PASSWORD: rba
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - rba_postgres_data:/var/lib/postgresql/data
      - ./compose/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rba -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rba
      RABBITMQ_DEFAULT_PASS: rba
    volumes:
      - rba_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  rba_redis_data:
  rba_postgres_data:
  rba_rabbitmq_data:
